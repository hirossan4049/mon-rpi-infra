# System
common_timezone: "Asia/Tokyo"
common_locale: "ja_JP.UTF-8"
signage_user: "signage"

# WiFi Enterprise
wifi_ssid: "CorpWiFi"
wifi_identity: "{{ vault_wifi_identity }}"
wifi_password: "{{ vault_wifi_password }}"

# Bluetooth
bt_discoverable: true

# Display
display_output: "HDMI-A-1"
display_rotation: 0

# Application
kiosk_app_binary_name: "tauri-app"
kiosk_app_deb_file: "MONSTER_0.1.3_arm64.deb"
