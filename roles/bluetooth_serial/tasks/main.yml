---
- name: Install Bluetooth packages
  ansible.builtin.apt:
    name:
      - bluez
      - bluez-tools
      - python3-dbus
      - python3-gi
    state: present

- name: Configure Bluetooth device name
  ansible.builtin.lineinfile:
    path: /etc/bluetooth/main.conf
    regexp: "^#?Name ="
    line: "Name = {{ bt_device_name }}"
    insertafter: "\\[General\\]"
  notify: restart bluetooth

- name: Configure Bluetooth discoverability timeout
  ansible.builtin.lineinfile:
    path: /etc/bluetooth/main.conf
    regexp: "^#?DiscoverableTimeout ="
    line: "DiscoverableTimeout = 0"
    insertafter: "\\[General\\]"
  notify: restart bluetooth

- name: Configure Bluetooth pairable timeout
  ansible.builtin.lineinfile:
    path: /etc/bluetooth/main.conf
    regexp: "^#?PairableTimeout ="
    line: "PairableTimeout = 0"
    insertafter: "\\[General\\]"
  notify: restart bluetooth

- name: Deploy SPP server script
  ansible.builtin.copy:
    src: bt-spp-server.py
    dest: /usr/local/bin/bt-spp-server.py
    owner: root
    group: root
    mode: "0755"
  notify: restart bt-spp

- name: Deploy SPP systemd service
  ansible.builtin.template:
    src: bt-spp.service.j2
    dest: /etc/systemd/system/bt-spp.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart bt-spp

- name: Enable and start SPP service
  ansible.builtin.systemd:
    name: bt-spp
    enabled: true
    state: started
    daemon_reload: true
