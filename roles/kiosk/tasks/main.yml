---
- name: Copy Tauri application .deb package
  ansible.builtin.copy:
    src: "{{ kiosk_app_deb_file }}"
    dest: "/tmp/{{ kiosk_app_deb_file }}"
    mode: "0644"

- name: Install Tauri application from .deb package
  ansible.builtin.apt:
    deb: "/tmp/{{ kiosk_app_deb_file }}"
    state: present

- name: Clean up .deb package
  ansible.builtin.file:
    path: "/tmp/{{ kiosk_app_deb_file }}"
    state: absent

- name: Enable desktop autologin
  ansible.builtin.command: raspi-config nonint do_boot_behaviour B4
  changed_when: true

- name: Disable screen blanking
  ansible.builtin.command: raspi-config nonint do_blanking 1
  changed_when: true

- name: Create labwc config directory
  ansible.builtin.file:
    path: "/home/{{ signage_user }}/.config/labwc"
    state: directory
    owner: "{{ signage_user }}"
    group: "{{ signage_user }}"
    mode: "0755"

- name: Deploy labwc autostart
  ansible.builtin.template:
    src: labwc-autostart.j2
    dest: "/home/{{ signage_user }}/.config/labwc/autostart"
    owner: "{{ signage_user }}"
    group: "{{ signage_user }}"
    mode: "0755"

- name: Verify application binary is executable
  ansible.builtin.stat:
    path: "/usr/bin/{{ kiosk_app_binary_name }}"
  register: app_binary
  failed_when: not app_binary.stat.executable
