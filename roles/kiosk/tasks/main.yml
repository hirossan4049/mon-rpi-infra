---
- name: Install Tauri runtime dependencies
  ansible.builtin.apt:
    name:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ kiosk_app_install_dir }}"
    state: directory
    owner: "{{ signage_user }}"
    group: "{{ signage_user }}"
    mode: "0755"

- name: Deploy Tauri application binary
  ansible.builtin.copy:
    src: "{{ kiosk_app_binary_name }}"
    dest: "{{ kiosk_app_install_dir }}/{{ kiosk_app_binary_name }}"
    owner: "{{ signage_user }}"
    group: "{{ signage_user }}"
    mode: "0755"

- name: Enable desktop autologin
  ansible.builtin.command: raspi-config nonint do_boot_behaviour B4
  changed_when: true

- name: Disable screen blanking
  ansible.builtin.command: raspi-config nonint do_blanking 1
  changed_when: true

- name: Create labwc config directory
  ansible.builtin.file:
    path: "/home/{{ signage_user }}/.config/labwc"
    state: directory
    owner: "{{ signage_user }}"
    group: "{{ signage_user }}"
    mode: "0755"

- name: Deploy labwc autostart
  ansible.builtin.template:
    src: labwc-autostart.j2
    dest: "/home/{{ signage_user }}/.config/labwc/autostart"
    owner: "{{ signage_user }}"
    group: "{{ signage_user }}"
    mode: "0755"

- name: Verify application binary is executable
  ansible.builtin.stat:
    path: "{{ kiosk_app_install_dir }}/{{ kiosk_app_binary_name }}"
  register: app_binary
  failed_when: not app_binary.stat.executable
